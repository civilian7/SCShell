[package]
name = "rata_shell"
version = "0.1.0"
edition = "2021"
authors = ["RataShell"]
description = "Embeddable Windows shell component (ConPTY + Ratatui) for Delphi hosts"
license = "MIT"

[lib]
# 산출물 이름은 비트수와 무관하게 sc_shell.dll 하나다 — 32/64 는 tools\build.ps1 이
# 폴더로 가른다(bin\ / bin\win32\). 접미어를 쓰지 않는 이유는 그 스크립트 머리말 참조.
name = "sc_shell"
crate-type = ["cdylib"]

[dependencies]
alacritty_terminal = "0.25"
unicode-width = "0.2"
crossbeam-channel = "0.5"
parking_lot = "0.12"
once_cell = "1"

[dependencies.windows]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# ★panic = "abort" 를 쓰면 안 된다. ffi.rs 의 모든 진입점이 catch_unwind 로 panic 이 FFI 경계를
#   넘지 않게 막고 RATA_ERR_PANIC 을 돌려주도록 설계돼 있는데, abort 에서는 panic 이 언와인드
#   자체를 하지 않고 즉시 프로세스를 죽인다 — 그 가드가 전부 죽은 코드가 되고, alacritty 내부의
#   인덱스 panic 하나로 Delphi 호스트가 통째로 abort 된다.
panic = "unwind"
strip = "symbols"

[profile.dev]
panic = "unwind"

[build-dependencies]
cbindgen = "0.27"
