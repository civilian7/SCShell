[package]
name = "rata_shell"
version = "0.1.0"
edition = "2021"
authors = ["RataShell"]
description = "Embeddable Windows shell component (ConPTY + Ratatui) for Delphi hosts"
license = "MIT"

[lib]
# Output is renamed to sc_shell64.dll / sc_shell32.dll by tools\build.ps1
# depending on target architecture.
name = "sc_shell"
crate-type = ["cdylib"]

[dependencies]
alacritty_terminal = "0.25"
unicode-width = "0.2"
crossbeam-channel = "0.5"
parking_lot = "0.12"
once_cell = "1"

[dependencies.windows]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"

[build-dependencies]
cbindgen = "0.27"
